<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精選作品展示 | 小金馬金工 Jinma Atelier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/chiron-goround-tc/index.css">
    <style>
        body { Chiron GoRound TC Variable: 'Noto Serif TC', serif; background-color: #FBF9F5; color: #232323; }
        Chiron GoRound TC Variable { Chiron GoRound TC Variable: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#FBF9F5] text-[#232323] antialiased">

    <!-- 導覽列 -->
    <header class="sticky top-0 z-40 bg-[#FBF9F5]/90 backdrop-blur-md border-b border-[#EAE5D9]">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full object-cover border border-[#D4AF37]">
                <span class="font-playfair text-xs tracking-widest hover:text-[#D4AF37] transition-colors">&larr; 返回 JINMA ATELIER 首頁</span>
            </a>
            <span class="text-xs tracking-[0.2em] text-[#666]">精選作品展示</span>
        </div>
    </header>

    <!-- 作品集主內容 -->
    <main class="py-20 px-6 max-w-5xl mx-auto space-y-16">
        <div class="text-center max-w-2xl mx-auto">
            <span class="text-xs uppercase tracking-[0.3em] text-[#D4AF37] block mb-2">Artistic Portfolio</span>
            <h1 class="font-playfair text-4xl font-light tracking-wide text-[#232323] mb-4">精選作品展示</h1>
            <div class="w-12 h-[1px] bg-[#D4AF37] mx-auto mt-4"></div>
            <p class="text-xs text-[#666] mt-4 font-light leading-relaxed">探索小金馬金工歷年的匠心之作、競賽作品與細緻質感呈現。</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white border border-[#EAE5D9] p-4 shadow-sm">
                <div class="h-96 overflow-hidden mb-4"><img src="work1.jpg" class="w-full h-full object-cover" alt="精選作品 1"></div>
                <span class="text-[10px] text-[#D4AF37] tracking-widest uppercase block mb-1">Masterpiece 01</span>
                <h3 class="font-playfair text-xl text-[#232323]">小金馬金工精選珠寶創作</h3>
                <p class="text-xs text-[#666] font-light mt-2">融合精緻金工與寶石美學的匠心呈現。</p>
            </div>
            <div class="bg-white border border-[#EAE5D9] p-4 shadow-sm">
                <div class="h-96 overflow-hidden mb-4"><img src="work2.jpg" class="w-full h-full object-cover" alt="精選作品 2"></div>
                <span class="text-[10px] text-[#D4AF37] tracking-widest uppercase block mb-1">Masterpiece 02</span>
                <h3 class="font-playfair text-xl text-[#232323]">小金馬金工精選珠寶創作</h3>
                <p class="text-xs text-[#666] font-light mt-2">細膩線條與金屬光影的完美交織。</p>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-[#232323] text-[#FBF9F5] py-12 text-center text-xs">
        <p>&copy; 2026 Jinma Atelier 小金馬金工. All Rights Reserved.</p>
    </footer>
</body>
</html>
