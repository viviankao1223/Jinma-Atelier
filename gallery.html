<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精選作品展示 | 小金馬金工 Jinma Atelier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/chiron-goround-tc/index.css">
    <style>
        body { 
            font-family: 'Chiron GoRound TC Variable', sans-serif; 
            background-color: #FBF9F5; 
            color: #232323; 
            letter-spacing: 0.1em; 
        }
        .font-playfair { 
            font-family: 'Chiron GoRound TC Variable', sans-serif; 
        }
    </style>
</head>
<body class="bg-[#FBF9F5] text-[#232323] antialiased">

    <!-- 導覽列 -->
    <header class="sticky top-0 z-40 bg-[#FBF9F5]/90 backdrop-blur-md border-b border-[#EAE5D9]">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="logo.png" alt="小金馬金工 Logo" class="w-12 h-12 rounded-full object-cover border border-[#D4AF37]">
                <div>
                    <span class="font-playfair text-lg tracking-widest font-normal block text-[#232323]">JINMA ATELIER</span>
                    <span class="text-[10px] tracking-[0.25em] text-[#666666] block">小金馬金工</span>
                </div>
            </a>
            <nav class="hidden md:flex items-center space-x-8 text-xs tracking-widest">
                <a href="index.html" class="hover:text-[#D4AF37] transition-colors py-2">首頁</a>
                <a href="courses.html" class="hover:text-[#D4AF37] transition-colors py-2">體驗課程</a>
                <a href="custom.html" class="hover:text-[#D4AF37] transition-colors py-2">珠寶訂製</a>
                <a href="handdrawn.html" class="hover:text-[#D4AF37] transition-colors py-2">手繪/手寫系列</a>
                <a href="gallery.html" class="text-[#D4AF37] font-semibold py-2">作品展示</a>
            </nav>
            <a href="index.html#contact" class="hidden lg:inline-block px-6 py-2 border border-[#232323] text-xs tracking-[0.2em] uppercase hover:bg-[#232323] hover:text-[#FBF9F5] transition-all">預約諮詢</a>
        </div>
    </header>

    <!-- 作品集主內容 -->
    <main class="py-20 px-6 max-w-5xl mx-auto space-y-16">
        <div class="text-center max-w-2xl mx-auto">
            <span class="text-xs uppercase tracking-[0.3em] text-[#D4AF37] block mb-2">Artistic Portfolio</span>
            <h1 class="font-playfair text-4xl font-light tracking-wide text-[#232323] mb-4">精選作品展示</h1>
            <div class="w-12 h-[1px] bg-[#D4AF37] mx-auto mt-4"></div>
            <p class="text-xs text-[#666] mt-4 font-light leading-relaxed">探索小金馬金工歷年的匠心之作、競賽作品與細緻質感呈現。</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white border border-[#EAE5D9] p-4 shadow-sm">
                <div class="h-96 overflow-hidden mb-4"><img src="work1.JPG" class="w-full h-full object-cover object-[50%_70%]" alt="精選作品 1"></div>
                <span class="text-[10px] text-[#D4AF37] tracking-widest uppercase block mb-1">Masterpiece 01</span>
                <h3 class="font-playfair text-xl text-[#232323]">珠寶鑲嵌創作</h3>
                <p class="text-xs text-[#666] font-light mt-2">融合精緻金工與寶石鑲嵌技術的完美呈現。</p>
            </div>
            <div class="bg-white border border-[#EAE5D9] p-4 shadow-sm">
                <div class="h-96 overflow-hidden mb-4"><img src="work2.JPG" class="w-full h-full object-cover object-[50%_30%]" alt="精選作品 2"></div>
                <span class="text-[10px] text-[#D4AF37] tracking-widest uppercase block mb-1">Masterpiece 02</span>
                <h3 class="font-playfair text-xl text-[#232323]">精雕金工創作</h3>
                <p class="text-xs text-[#666] font-light mt-2">細膩線條與金屬光影的相互交織。</p>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-[#232323] text-[#FBF9F5] py-12 text-center text-xs">
        <p>&copy; 2026 Jinma Atelier 小金馬金工. All Rights Reserved.</p>
    </footer>
</body>
</html>
