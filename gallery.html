<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精選作品展示 | 小金馬金工 Jinma Atelier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Noto+Serif+TC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif TC', serif; background-color: #FBF9F5; color: #232323; }
        .font-playfair { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#FBF9F5] text-[#232323] antialiased">

    <!-- 導覽列 -->
    <header class="sticky top-0 z-40 bg-[#FBF9F5]/90 backdrop-blur-md border-b border-[#EAE5D9]">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="font-playfair text-xs tracking-widest hover:text-[#D4AF37] transition-colors">&larr; 返回 JINMA ATELIER 首頁</a>
            <span class="text-xs tracking-[0.2em] text-[#666]">精選作品展示</span>
        </div>
    </header>

    <!-- 作品集主內容 -->
    <main class="py-20 px-6 max-w-6xl mx-auto space-y-16">
        <div class="text-center max-w-2xl mx-auto">
            <span class="text-xs uppercase tracking-[0.3em] text-[#D4AF37] block mb-2">Artistic Portfolio</span>
            <h1 class="font-playfair text-4xl font-light tracking-wide text-[#232323] mb-4">精選作品展示</h1>
            <div class="w-12 h-[1px] bg-[#D4AF37] mx-auto mt-4"></div>
            <p class="text-xs text-[#666] mt-4 font-light leading-relaxed">探索小金馬金工歷年的匠心之作、競賽作品與細緻質感呈現。</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="bg-white border border-[#EAE5D9] p-4 shadow-sm">
                <div class="h-80 overflow-hidden mb-4"><img src="https://images.unsplash.com/photo-1603561591411-07134e71a2a9?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover"></div>
                <span class="text-[10px] text-[#D4AF37] tracking-widest uppercase block mb-1">Custom Ring</span>
                <h3 class="font-playfair text-lg text-[#232323]">流金歲月彩色寶石鑲嵌戒</h3>
                <p class="text-xs text-[#666] font-light mt-2">以流線造型交織純銀戒台，細緻鑲嵌多顆漸層色彩晶石。</p>
            </div>
            <div class="bg-white border border-[#EAE5D9] p-4 shadow-sm">
                <div class="h-80 overflow-hidden mb-4"><img src="https://images.unsplash.com/photo-1599643477877-530eb83abc8e?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover"></div>
                <span class="text-[10px] text-[#D4AF37] tracking-widest uppercase block mb-1">Pendant</span>
                <h3 class="font-playfair text-lg text-[#232323]">手寫字跡純銀訂製項鍊</h3>
                <p class="text-xs text-[#666] font-light mt-2">完美復刻親筆手寫字跡的優雅項鍊，佩戴時貼近心跳。</p>
            </div>
            <div class="bg-white border border-[#EAE5D9] p-4 shadow-sm">
                <div class="h-80 overflow-hidden mb-4"><img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover"></div>
                <span class="text-[10px] text-[#D4AF37] tracking-widest uppercase block mb-1">Workshop</span>
                <h3 class="font-playfair text-lg text-[#232323]">經典槌目紋對戒體驗</h3>
                <p class="text-xs text-[#666] font-light mt-2">學員於工作室親手敲擊出的細緻槌目紋理與溫潤光澤。</p>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-[#232323] text-[#FBF9F5] py-12 text-center text-xs">
        <p>&copy; 2026 Jinma Atelier 小金馬金工. All Rights Reserved.</p>
    </footer>
</body>
</html>
